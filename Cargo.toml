[package]
name = "investment-portfolio"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
askama = { version = "0.16.0", features = ["derive"] }
axum = { version = "0.8.9", features = ["macros"] }
axum-extra = { version = "0.12.6", features = ["cookie-signed"] }
color-eyre = "0.6.5"
dotenvy = "0.15.7"
jwt-simple = "0.13.0"
password-auth = "1.0.0"
rust_decimal = { version = "1.36", features = [
    "db-postgres",
    "serde-with-str",
] }
rust_decimal_macros = "1.36"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = [
    "macros",
    "postgres",
    "runtime-tokio",
    "rust_decimal",
    "time",
] }
thiserror = "2.0.19"
time = { version = "0.3.55", features = ["serde", "formatting", "macros"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
insta = { version = "1.48.0", features = ["json"] }
