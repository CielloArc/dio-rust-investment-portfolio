<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,700;1,400;1,700&display=swap"
        rel="stylesheet">
</head>

<body class="flex justify-center items-center min-h-screen text-slate-800" style="background-color: #CCDCE6; font-family: 'Roboto', sans-serif;">
    <div
        class="w-full max-w-sm bg-white/40 backdrop-blur-xl border border-white/60 rounded-2xl p-8 shadow-xl">
        <form method="POST" action="/login" class="flex flex-col gap-5">
            <input type="text" name="username" placeholder="username" required autocomplete="username"
                class="w-full px-4 py-3 bg-white border border-slate-300 rounded-xl text-slate-800 placeholder-slate-400 focus:outline-none focus:border-cyan-600 transition-all duration-300">

            <input type="password" name="password" placeholder="password" required autocomplete="current-password"
                class="w-full px-4 py-3 bg-white border border-slate-300 rounded-xl text-slate-800 placeholder-slate-400 focus:outline-none focus:border-cyan-600 transition-all duration-300">

            <button type="submit"
                class="px-4 py-3 bg-cyan-600/10 border border-cyan-600/30 rounded-xl text-cyan-700 font-medium hover:bg-cyan-600/20 transition-all duration-300">
                submit
            </button>
        </form>
    </div>
</body>

</html>
